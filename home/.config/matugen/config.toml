[config]
reload_apps = false
set_wallpaper = false
mode = "dark"

[templates.hyprland-colors]
input_path = "~/.config/matugen/templates/hyprland-colors.conf"
output_path = "~/.config/hypr/colors.conf"
post_hook = "hyprctl reload"

[templates.hyprland-colors-lua]
input_path = "~/.config/matugen/templates/hyprland-colors.lua"
output_path = "~/.config/hypr/colors.lua"

[templates.ramp]
input_path = "~/.config/matugen/templates/ramp-seed.json"
output_path = "~/.cache/matugen/seed.json"
post_hook = "~/.config/matugen/ramp"
